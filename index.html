<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPE MOMENT PRO | LIVE</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: linear-gradient(to bottom, #ff0000, #000);
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .main-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 10px;
        }

        /* Контейнер для плеера */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
            height: 0;
            overflow: hidden;
            border: 3px solid #333;
            border-radius: 10px;
            background: #111;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .status-bar {
            background: #1a1a1a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-indicator {
            color: #ff0000;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .live-dot {
            height: 10px;
            width: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .specs {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-telegram {
            display: inline-block;
            background: #0088cc;
            color: #fff;
            padding: 15px 30px;
            margin-top: 25px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-telegram:hover {
            background: #00aaff;
            transform: scale(1.05);
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        🔥 HYPE MOMENT PRO 🔥
    </header>

    <div class="main-container">
        <div class="video-wrapper">
            <iframe
                src="https://player.kick.com/hypemoment_pro"
                frameborder="0"
                scrolling="no"
                allowfullscreen="true">
            </iframe>
        </div>

        <div class="status-bar">
            <div class="live-indicator">
                <span class="live-dot"></span> ПРЯМОЙ ЭФИР: ТЕСТ СИСТЕМЫ
            </div>
            <div class="specs">
                RTX 4060 POWERED
            </div>
        </div>

        <a href="https://t.me/твой_канал" class="btn-telegram">
            ПОДПИСАТЬСЯ В TELEGRAM
        </a>
    </div>

    <footer>
        OFFICIAL STREAM PLATFORM BY MEDET
    </footer>

</body>
</html>
