<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPE MOMENT PRO | OFFICIAL</title>
    <style>
        :root {
            --red: #ff0000;
            --gold: #ffd700;
            --bg: #050505;
            --panel: #121212;
        }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ СВЯЗИ */
        .admin-contact {
            width: 100%;
            background: linear-gradient(90deg, #000, #222, #000);
            border-bottom: 1px solid var(--gold);
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            color: var(--gold);
            letter-spacing: 1px;
            font-weight: bold;
        }

        header { 
            width: 100%; 
            background: linear-gradient(180deg, var(--red) 0%, #000 100%); 
            padding: 15px 0; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(255,0,0,0.3);
        }

        /* ОСНОВНОЙ ПЛАН: ВИДЕО + КНОПКИ */
        .main-layout {
            width: 98%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 15px;
            margin: 20px 0;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .video-wrapper { width: 100%; }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222;
        }

        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* ПАНЕЛЬ КНОПОК СПРАВА */
        .side-panel {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .panel-title {
            color: var(--gold);
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .btn {
            padding: 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            font-size: 15px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }

        .btn-donate { background: linear-gradient(90deg, #ffd700, #ff8c00); color: #000; }
        .btn-inst { background: linear-gradient(45deg, #f09433, #bc1888); }
        .btn-tg { background: #0088cc; }
        .btn-yt { background: var(--red); }

        .status-info {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #111;
            font-size: 12px;
            margin-top: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--red);
        }

        footer { padding: 30px; color: #444; font-size: 11px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="admin-contact">
        СВЯЗЬ / CONTACT ADMIN: <span style="color: #fff;">@hypemoment_pro</span>
    </div>

    <header>
        <div style="font-size: 26px; font-weight: 900; letter-spacing: 3px;">HYPE MOMENT PRO</div>
    </header>

    <div class="main-layout">
        <div class="video-wrapper">
            <div class="video-box">
                <iframe src="https://player.kick.com/hypemoment-pro?origin=graphicsajaj-max.github.io" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
            </div>
            <div class="status-info">
                <div style="color:red; font-weight: bold;">● LIVE / В ЭФИРЕ</div>
                <div style="color:#00ff00; font-weight: bold;">RTX 4060 POWERED</div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-title">Поддержать и Подписаться</div>
            
            <a href="https://www.donationalerts.com/r/tim04745774" class="btn btn-donate" target="_blank">💰 ДОНАТ / DONATE</a>
            <a href="https://t.me/hypemoment_pro" class="btn btn-tg" target="_blank">✈️ TELEGRAM</a>
            <a href="https://www.instagram.com/hypemoment_pro?igsh=MTZxY281ZWg2eGx2ZA==" class="btn btn-inst" target="_blank">📸 INSTAGRAM</a>
            <a href="https://www.youtube.com/@HYPEMOMENTPRO?sub_confirmation=1" class="btn btn-yt" target="_blank">🎬 YOUTUBE</a>
        </div>
    </div>

    <footer>OFFICIAL PLATFORM BY MEDET | © 2026</footer>

</body>
</html>
