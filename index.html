<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPE MOMENT PRO | OFFICIAL STREAM</title>
    <style>
        :root {
            --main-red: #ff0000;
            --gold: linear-gradient(90deg, #ffd700, #ff8c00);
            --tg-blue: #0088cc;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Анимированная шапка */
        header {
            width: 100%;
            background: linear-gradient(180deg, var(--main-red) 0%, #000 100%);
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: clamp(24px, 8vw, 36px);
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Главная кнопка YouTube */
        .btn-youtube {
            display: block;
            width: 90%;
            max-width: 550px;
            background: var(--main-red);
            color: white;
            text-decoration: none;
            padding: 18px;
            margin: 20px 0;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            border: 2px solid #fff;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            animation: pulse 2s infinite;
            transition: 0.3s;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(255, 0, 0, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
        }

        /* Контейнер для плеера Kick */
        .player-section {
            width: 95%;
            max-width: 900px;
            margin: 10px auto;
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #222;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Инфо-панель под видео */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #151515;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 5px solid var(--main-red);
        }

        .live-tag {
            color: var(--main-red);
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: var(--main-red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .gpu-tag {
            color: #00ff00;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Кнопки действий */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 550px;
            margin: 30px auto;
        }

        .btn-action {
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-donate {
            background: var(--gold);
            color: #000;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-tg {
            background: var(--tg-blue);
            color: white;
            font-size: 18px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        footer {
            margin: 40px 0;
            color: #444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 HYPE MOMENT PRO 🔥</div>
    </header>

    <a href="https://www.youtube.com/@HYPEMOMENTPRO?sub_confirmation=1" class="btn-youtube" target="_blank">
        🎬 ПОДПИСАТЬСЯ НА YOUTUBE
    </a>

    <div class="player-section">
        <div class="video-box">
            <iframe
                src="https://player.kick.com/hypemoment-pro?origin=graphicsajaj-max.github.io"
                frameborder="0"
                scrolling="no"
                allowfullscreen="true">
            </iframe>
        </div>

        <div class="status-bar">
            <div class="live-tag">
                <span class="dot"></span> ПРЯМОЙ ЭФИР
            </div>
            <div class="gpu-tag">POWERED BY RTX 4060</div>
        </div>
    </div>

    <div class="buttons-container">
        <a href="https://www.donationalerts.com/r/tim04745774" class="btn-action btn-donate" target="_blank">
            💰 ПОДДЕРЖАТЬ (ДОНАТ) 💰
        </a>

        <a href="https://t.me/hypemoment_pro" class="btn-action btn-tg" target="_blank">
            ✈️ НАШ TELEGRAM КАНАЛ
        </a>
    </div>

    <footer>
        © 2026 HYPE MOMENT PRO | BY MEDET
    </footer>

</body>
</html>
